services:
  painel-pbx:
    build: .
    image: painel-pbx:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: ${DB_PATH:-/data/panel.sqlite}
      PORT: ${PORT:-3000}
    ports:
      - "${PANEL_PORT:-8080}:${PORT:-3000}"
    volumes:
      - painel-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  painel-data:
